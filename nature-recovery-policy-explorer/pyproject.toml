[project]
name = "nature-recovery-policy-explorer"
version = "0.1.0"
description = "Policy scenario explorer for nature recovery tradeoffs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0",
  "dbt-duckdb>=1.8.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
